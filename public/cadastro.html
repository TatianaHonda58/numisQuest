<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro — NumisQuest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="/">NumisQuest</a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="container">
    <h1>Criar Conta de Explorador</h1>
    <p class="subtitle">Cadastre-se para acumular XP, subir de nível e desbloquear medalhas numismáticas.</p>

    <div id="alert" hidden></div>

    <div class="card" style="max-width: 440px;">
      <form id="register-form" class="form">
        <div class="field">
          <label for="name">Nome completo</label>
          <input type="text" id="name" required placeholder="Ex: Tatiana Mitiko" />
        </div>

        <div class="field">
          <label for="username">Nome de usuário (username)</label>
          <input type="text" id="username" required placeholder="Ex: tatiana_exploradora" />
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com" />
        </div>

        <div class="field">
          <label for="password">Senha (mínimo 6 caracteres)</label>
          <input type="password" id="password" minlength="6" required placeholder="******" />
        </div>

        <button type="submit" class="btn">Cadastrar</button>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      clearAlert(alertEl);

      const name = document.getElementById('name').value;
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const session = await apiFetch('/api/auth/register', {
          method: 'POST',
          body: { name, username, email, password }
        });
        setSession(session);
        window.location.href = '/desafios';
      } catch (err) {
        showAlert(alertEl, err.message, 'error');
      }
    });
  </script>
</body>
</html>
