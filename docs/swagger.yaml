openapi: 3.0.3
info:
  title: NumisQuest — Catálogo, Identificador & Desafios API
  description: |
    API RESTful da plataforma **NumisQuest** voltada ao universo da numismática, com três pilares:
    **Catálogo de Moedas e Cédulas**, **Identificador de Moedas** e **Desafios & Conquistas**.

    ### Regras de negócio
    1. **Unicidade de Cadastro:** Não permite dois exploradores com o mesmo e-mail ou username (`HTTP 409`).
    2. **Identificador de Moedas:** Exige ao menos 1 critério de busca (`HTTP 400` se vazio) e calcula percentual de compatibilidade.
    3. **Níveis de Experiência (XP):** Explorador Iniciante (`0-99` pts), Curador de Museu (`100-249` pts) e Mestre Numismata (`250+` pts).
    4. **Idempotência de Desafios:** Cada desafio concluído só concede pontos e medalhas uma única vez por usuário (`HTTP 422`).
  version: 2.0.0
servers:
  - url: http://localhost:3000
    description: Servidor local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /api/health:
    get:
      tags: [Sistema]
      summary: Verifica saúde da API
      responses:
        '200':
          description: API operacional
  /api/auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastra um novo explorador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, email, password]
              properties:
                name: { type: string, example: "Lucas Mendes" }
                username: { type: string, example: "lucas_numis" }
                email: { type: string, example: "lucas@email.com" }
                password: { type: string, example: "123456" }
      responses:
        '201': { description: Usuário cadastrado }
        '400': { description: Dados inválidos }
        '409': { description: E-mail ou username já em uso }
  /api/auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica explorador e retorna token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "denise@email.com" }
                password: { type: string, example: "123456" }
      responses:
        '200': { description: Login realizado com sucesso }
        '401': { description: Credenciais inválidas }
  /api/users/me:
    get:
      tags: [Explorador]
      summary: Retorna perfil, XP, nível e medalhas do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dados do perfil }
        '401': { description: Token ausente ou inválido }
    patch:
      tags: [Explorador]
      summary: Atualiza nome ou username do explorador autenticado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Denise Moraes Silva" }
                username: { type: string, example: "denise_numis" }
      responses:
        '200': { description: Perfil atualizado com sucesso }
        '400': { description: Nenhum campo informado ou valor vazio }
        '401': { description: Token ausente ou inválido }
        '409': { description: Nome de usuário (username) já está em uso }
  /api/items:
    get:
      tags: [Catálogo]
      summary: Lista moedas e cédulas com filtros combinados
      parameters:
        - in: query
          name: tipo
          schema: { type: string, enum: [Moeda, Cédula] }
        - in: query
          name: pais
          schema: { type: string }
        - in: query
          name: ano
          schema: { type: integer }
        - in: query
          name: material
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: Lista filtrada de itens }
  /api/items/{id}:
    get:
      tags: [Catálogo]
      summary: Consulta ficha técnica e histórica completa de uma peça
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Ficha técnica da peça }
        '400': { description: ID inválido }
        '404': { description: Peça não encontrada }
  /api/items/identify:
    post:
      tags: [Identificador]
      summary: Identifica moedas ou cédulas a partir de características físicas/visuais
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pais: { type: string, example: "Brasil" }
                tipo: { type: string, example: "Moeda" }
                anoEmissao: { type: integer, example: 2012 }
                valorFacial: { type: string, example: "1 Real" }
                material: { type: string, example: "Bimetálica" }
                formato: { type: string, example: "Circular" }
                caracteristicaVisual: { type: string, example: "Bandeira Olímpica" }
      responses:
        '200': { description: Lista de correspondências ordenadas por compatibilidade }
        '400': { description: Nenhum critério informado }
  /api/challenges:
    get:
      tags: [Desafios & Conquistas]
      summary: Lista quizzes, missões e conquistas do usuário
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Desafios e medalhas }
        '401': { description: Token ausente ou inválido }
  /api/challenges/{id}/submit:
    post:
      tags: [Desafios & Conquistas]
      summary: Envia resposta de um desafio e computa XP e conquistas
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedOptionIndex]
              properties:
                selectedOptionIndex: { type: integer, example: 1 }
      responses:
        '200': { description: Resultado da tentativa (acerto ou erro) }
        '400': { description: Dados inválidos }
        '401': { description: Token ausente ou inválido }
        '404': { description: Desafio não encontrado }
        '422': { description: Desafio já concluído pelo usuário }
  /api/challenges/progress:
    delete:
      tags: [Desafios & Conquistas]
      summary: Reseta pontuação (XP), desafios concluídos e medalhas do explorador
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Progresso resetado com sucesso }
        '401': { description: Token ausente ou inválido }
        '404': { description: Explorador não encontrado }  