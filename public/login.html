<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — NumisQuest</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="/">NumisQuest</a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="container">
    <h1>Login</h1>
    <p class="subtitle">Acesse sua conta para participar dos desafios e acompanhar suas conquistas.</p>

    <div id="alert" hidden></div>

    <div class="card" style="max-width: 440px;">
      <form id="login-form" class="form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com" />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required placeholder="******" />
        </div>

        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      clearAlert(alertEl);

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const session = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: { email, password }
        });
        setSession(session);
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || '/desafios';
      } catch (err) {
        showAlert(alertEl, err.message, 'error');
      }
    });
  </script>
</body>
</html>
