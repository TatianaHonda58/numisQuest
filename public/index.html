<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NumisQuest — Catálogo de Moedas e Cédulas</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="/">NumisQuest</a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

<!-- Pop-up (Modal) de Visualização Ampliada -->
    <div id="image-modal" class="image-modal" hidden onclick="closeImageModal(event)">
      <div class="image-modal__box" onclick="event.stopPropagation()">
        <div class="image-modal__header">
          <strong id="modal-title" style="color: var(--primary);"></strong>
          <div class="row">
            <button type="button" class="btn btn--ghost" id="btn-toggle-zoom" onclick="toggleImageZoom()">🔍 Ampliar (1.6x)</button>
            <button type="button" class="btn" onclick="closeImageModal()">Fechar ✕</button>
          </div>
        </div>
        <div class="image-modal__img-wrap">
          <img id="modal-img" src="" alt="" onclick="toggleImageZoom()" />
        </div>
        <p class="item-card__meta" style="margin-top:10px;">Clique na imagem ou no botão acima para alternar o zoom.</p>
      </div>
    </div>

  <main class="container">
    <h1>Catálogo de Moedas e Cédulas</h1>
    <p class="subtitle">
  <strong>Explore, identifique e colecione conhecimento!</strong><br />
  Descubra moedas e cédulas, conheça suas características físicas, explore suas histórias e teste seus conhecimentos em desafios interativos.
  </p>

    <div id="alert" hidden></div>

    <!-- Barra de Filtros do Catálogo -->
    <section class="summary-box">
      <form id="filter-form" class="filter-grid">
        <div class="field col-search">
          <label for="filter-q">Pesquisa geral</label>
          <input type="text" id="filter-q" placeholder="Nome, valor facial ou código (ex: KM# 503)" />
        </div>

        <div class="field col-tipo">
          <label for="filter-tipo">Tipo de peça</label>
          <select id="filter-tipo">
            <option value="">Todos os tipos</option>
            <option value="Moeda">Moeda</option>
            <option value="Cédula">Cédula</option>
          </select>
        </div>

        <div class="field col-ano">
          <label for="filter-ano">Ano</label>
          <input type="number" id="filter-ano" placeholder="Ex: 1901" />
        </div>

        <div class="field col-pais">
          <label for="filter-pais">País</label>
          <input type="text" id="filter-pais" placeholder="Ex: Brasil, China, EUA" />
        </div>

        <div class="field col-mat">
          <label for="filter-material">Material</label>
          <input type="text" id="filter-material" placeholder="Ex: Cuproníquel, Prata, Papel-moeda" />
        </div>

        <div class="col-actions">
          <button type="submit" class="btn">Filtrar</button>
          <button type="button" class="btn btn--ghost" onclick="resetFilters()">Limpar</button>
        </div>
      </form>
    </section>

    <div id="catalog-grid" class="grid"></div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const ICONE_MOEDA = `
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
        <text x="22" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">$</text>
      </svg>`;

    const ICONE_CEDULA = `
      <svg width="56" height="36" viewBox="0 0 56 36" aria-hidden="true">
        <rect x="2" y="2" width="52" height="32" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
        <circle cx="28" cy="18" r="6" fill="none" stroke="#15803d" stroke-width="1.5"/>
      </svg>`;

    async function loadCatalog(queryString = '') {
      const alertEl = document.getElementById('alert');
      const grid = document.getElementById('catalog-grid');
      clearAlert(alertEl);

      try {
        const { items } = await apiFetch(`/api/items${queryString}`);
        if (!items.length) {
          grid.innerHTML = '<div class="card"><p>Nenhuma moeda ou cédula encontrada com os filtros informados.</p></div>';
          return;
        }

        grid.innerHTML = items.map((item) => {
          const iconeFallback = item.tipo === 'Moeda' ? ICONE_MOEDA : ICONE_CEDULA;
         const blocoVisual = item.imageFront && item.imageBack
            ? `
              <div class="coin-gallery">
                <img src="${item.imageFront}" alt="Anverso - ${item.titulo}" title="Clique para ampliar o Anverso" onclick="openImageModal('${item.imageFront}', 'Anverso — ${item.titulo.replace(/'/g, "\\'")}')" />
                <img src="${item.imageBack}" alt="Reverso - ${item.titulo}" title="Clique para ampliar o Reverso" onclick="openImageModal('${item.imageBack}', 'Reverso — ${item.titulo.replace(/'/g, "\\'")}')" />
              </div>
            `
            : `<div>${iconeFallback}</div>`;

          return `
            <article class="card item-card">
              <div class="row">
                <span class="badge">${item.tipo}</span>
                ${item.comemorativa ? '<span class="badge badge--raro">Comemorativa</span>' : ''}
                <span class="item-card__meta" style="margin-left:auto;">${item.codigoCatalogo}</span>
              </div>

              ${blocoVisual}

              <h3>${item.titulo}</h3>

              <p class="item-card__meta">
                <strong>País:</strong> ${item.pais} | <strong>Ano:</strong> ${item.anoEmissao}<br/>
                <strong>Período:</strong> ${item.periodo}<br/>
                <strong>Valor Facial:</strong> ${item.valorFacial} | <strong>Material:</strong> ${item.material}<br/>
                <strong>Peso:</strong> ${item.peso} | <strong>Dimensões:</strong> ${item.diametro}<br/>
                <strong>Formato:</strong> ${item.formato}
              </p>

              <details style="margin-top:auto; padding-top:10px; border-top:1px dashed var(--border);">
                <summary style="cursor:pointer; font-weight:700; color:var(--primary);">📜 Ver História e Detalhes Visuais</summary>
                <p class="item-card__meta" style="margin-top:8px;">
                  ${item.historico}<br/><br/>
                  <strong>Tiragem:</strong> ${item.tiragem.toLocaleString('pt-BR')} unidades.<br/>
                  <strong>Elementos visuais:</strong> ${(item.caracteristicasVisuais || []).join(', ')}.
                </p>
              </details>
            </article>
          `;
        }).join('');
      } catch (err) {
        showAlert(alertEl, err.message);
      }
    }

    document.getElementById('filter-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const params = new URLSearchParams();
      const q = document.getElementById('filter-q').value.trim();
      const tipo = document.getElementById('filter-tipo').value;
      const pais = document.getElementById('filter-pais').value.trim();
      const ano = document.getElementById('filter-ano').value.trim();
      const material = document.getElementById('filter-material').value.trim();

      if (q) params.set('q', q);
      if (tipo) params.set('tipo', tipo);
      if (pais) params.set('pais', pais);
      if (ano) params.set('ano', ano);
      if (material) params.set('material', material);

      const qs = params.toString() ? `?${params.toString()}` : '';
      loadCatalog(qs);
    });

    function resetFilters() {
      document.getElementById('filter-form').reset();
      loadCatalog();
    }

    document.addEventListener('DOMContentLoaded', () => loadCatalog());

    function openImageModal(src, title) {
      const modal = document.getElementById('image-modal');
      const img = document.getElementById('modal-img');
      const btnZoom = document.getElementById('btn-toggle-zoom');

      img.src = src;
      img.alt = title;
      img.classList.remove('is-zoomed');
      btnZoom.textContent = '🔍 Ampliar (1.6x)';
      document.getElementById('modal-title').textContent = title;
      modal.hidden = false;
    }

    function toggleImageZoom() {
      const img = document.getElementById('modal-img');
      const btnZoom = document.getElementById('btn-toggle-zoom');
      const zoomed = img.classList.toggle('is-zoomed');
      btnZoom.textContent = zoomed ? '🔎 Reduzir (1x)' : '🔍 Ampliar (1.6x)';
    }

    function closeImageModal() {
      document.getElementById('image-modal').hidden = true;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeImageModal();
    });
  </script>
</body>
</html>
